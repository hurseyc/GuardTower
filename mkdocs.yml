site_name: GuardTower
site_description: The fleet manager for AdGuard Home
site_url: https://hurseyc.github.io/GuardTower/
repo_url: https://github.com/hurseyc/GuardTower
repo_name: hurseyc/GuardTower
edit_uri: edit/main/docs/
copyright: GuardTower is MIT licensed and not affiliated with AdGuard Software Ltd.
exclude_docs: |
  dev/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.sections, navigation.top, search.suggest, content.code.copy]
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight
validation:
  links: { not_found: warn, anchors: warn }

# Generated by scripts/mkdocs_nav.py; don't edit by hand.
nav:
  - Home: index.md
  - "Getting started":
      - "Quick start": getting-started/quickstart.md
      - "First run": getting-started/first-run.md
      - "Try the demo": getting-started/demo.md
  - "Setup":
      - "Installing with Docker": setup/install-docker.md
      - "Installing on Linux / Proxmox LXC": setup/install-linux.md
      - "Adding instances": setup/adding-instances.md
      - "Proxmox API token": setup/proxmox-api.md
      - "Upgrade methods": setup/upgrade-methods.md
  - "Operation":
      - "The overview dashboard": operation/dashboard.md
      - "Instance details": operation/instance-detail.md
      - "Groups & settings layers": operation/groups.md
      - "Configuration & settings layers": operation/configuration.md
      - "Review & apply changes": operation/changes.md
      - "Upgrading AdGuard Home": operation/upgrades.md
      - "Hosts, sites & failure domains": operation/hosts.md
      - "Single points of failure": operation/resilience.md
      - "Topology map": operation/topology.md
      - "Analytics": operation/analytics.md
      - "Query log": operation/query-log.md
      - "Family DNS": operation/family.md
  - "Admin":
      - "Users & roles": admin/users.md
      - "Single sign-on (OIDC)": admin/sso.md
      - "Audit log": admin/audit-log.md
      - "Settings": admin/settings.md
      - "Updating GuardTower": admin/updating.md
      - "Notifications": admin/notifications.md
      - "Monitoring with Prometheus": admin/monitoring.md
      - "Backup & restore": admin/backup-restore.md
      - "Security hardening": admin/security.md
      - "Troubleshooting": admin/troubleshooting.md
  - "Reference":
      - "Configuration reference": reference/configuration.md
      - "FAQ": reference/faq.md

name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: context
    attributes:
      label: Your setup
      description: Number of instances, install methods, anything else relevant

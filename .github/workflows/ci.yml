name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  go:
    name: Go (lint, unit + integration tests)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Integration tests against real AdGuard Home
        run: go test -count=1 -tags integration ./internal/integration/...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/guardtower ./cmd/guardtower

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make build
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docs:
    name: Docs site (nav up to date, strict build with link and anchor checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt
      - name: Navigation matches the pages' front matter
        run: python3 scripts/mkdocs_nav.py && git diff --exit-code mkdocs.yml
      - run: mkdocs build --strict

  installers:
    name: Installers (shellcheck, install.sh on Debian and Ubuntu)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: shellcheck
        run: shellcheck install/install.sh install/proxmox-lxc.sh install/pkg/*.sh
      - name: Build a release archive like GoReleaser does
        run: |
          CGO_ENABLED=0 go build -trimpath -o stage/guardtower ./cmd/guardtower
          mkdir -p stage/install rel/latest/download
          cp LICENSE README.md stage/ && cp install/guardtower.service install/guardtower-update.path install/guardtower-update.service install/install.sh stage/install/
          tar -czf rel/latest/download/guardtower_linux_amd64.tar.gz -C stage guardtower LICENSE README.md install
          (cd rel/latest/download && sha256sum guardtower_linux_amd64.tar.gz > checksums.txt)
          (cd rel && python3 -m http.server 18999 --bind 127.0.0.1 &)
          sleep 1
      - name: install.sh on Debian 12 and Ubuntu 24.04
        run: |
          for image in debian:12 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm --network host -v "$PWD/install:/src:ro" "$image" bash -euc '
              apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
              export GT_INSTALL_BASE_URL=http://127.0.0.1:18999
              bash /src/install.sh
              /usr/local/bin/guardtower version
              test -d /var/lib/guardtower && getent passwd guardtower
              bash /src/install.sh --upgrade
              bash /src/install.sh --uninstall --purge
              test ! -e /usr/local/bin/guardtower && ! getent passwd guardtower
            '
            echo "::endgroup::"
          done
      - name: In-app update helper (systemd simulated with a systemctl shim)
        run: |
          docker run --rm --network host -v "$PWD/install:/src:ro" debian:12 bash -euc '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            export GT_INSTALL_BASE_URL=http://127.0.0.1:18999
            mkdir -p /run/systemd/system
            printf "#!/bin/sh\necho systemctl \"\$@\" >> /tmp/systemctl.log\n" > /usr/local/sbin/systemctl && chmod +x /usr/local/sbin/systemctl
            bash /src/install.sh
            test -x /usr/local/lib/guardtower/self-update -a -x /usr/local/lib/guardtower/install.sh
            grep -q "PathExists=/var/lib/guardtower/update/request" /etc/systemd/system/guardtower-update.path
            test -f /etc/systemd/system/guardtower-update.service
            test "$(stat -c %U /var/lib/guardtower/update)" = guardtower
            grep -q "enable --now guardtower-update.path" /tmp/systemctl.log
            # What the web UI does, then what the path unit starts:
            su -s /bin/sh guardtower -c "touch /var/lib/guardtower/update/request"
            /usr/local/lib/guardtower/self-update
            cat /var/lib/guardtower/update/last.log
            test "$(cat /var/lib/guardtower/update/last.exit)" = 0
            test ! -e /var/lib/guardtower/update/request
            grep -q "GuardTower upgraded" /var/lib/guardtower/update/last.log
            bash /src/install.sh --uninstall
            test ! -e /etc/systemd/system/guardtower-update.path -a ! -e /usr/local/lib/guardtower
          '

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

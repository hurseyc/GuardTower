name: Docs site

# Publishes docs/ to GitHub Pages for each release (and on demand), so the
# site always matches the latest released version. Enable Pages with
# "GitHub Actions" as the source under Settings → Pages first.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt
      - run: python3 scripts/mkdocs_nav.py && mkdocs build --strict -d site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
